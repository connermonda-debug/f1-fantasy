name: Update F1 Results

on:
  schedule:
    # Race day (Sunday) — every 30 min, 12:00–23:30 UTC.
    # Most races finish 14:00–22:00 UTC; tight cadence ensures results land
    # within ~30 min of the API publishing them.
    - cron: '*/30 12-23 * * 0'
    # Friday/Saturday — every 2 hours (qualifying + sprint coverage)
    - cron: '0 */2 * * 5,6'
    # Sunday early hours / Monday — once at 06:00 UTC to catch late corrections
    - cron: '0 6 * * 1'
    # Mon–Thu — once daily at 08:00 UTC for stragglers and reclassifications
    - cron: '0 8 * * 2,3,4'
  workflow_dispatch: {} # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest results
        run: node scripts/fetch-results.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update race results"
            git push
          fi
